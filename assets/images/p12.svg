<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="silk12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a1f1f"/>
      <stop offset="1" stop-color="#3a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#ead7b6"/>
  <!-- folded scarf shape -->
  <path d="M80,150 Q200,80 320,150 L340,250 Q200,330 60,250 Z" fill="url(#silk12)" stroke="#2a0606" stroke-width="2"/>
  <path d="M60,250 Q200,330 340,250 L350,330 Q200,420 50,330 Z" fill="#6a1818" stroke="#2a0606" stroke-width="2"/>
  <!-- paisley dots -->
  <g fill="#d8a868" opacity="0.85">
    <path d="M120,180 Q140,160 160,180 Q150,200 130,200 Z"/>
    <path d="M220,190 Q240,170 260,190 Q250,210 230,210 Z"/>
    <path d="M170,300 Q190,280 210,300 Q200,320 180,320 Z"/>
    <path d="M260,300 Q280,280 300,300 Q290,320 270,320 Z"/>
    <circle cx="100" cy="220" r="3"/><circle cx="180" cy="240" r="3"/><circle cx="280" cy="240" r="3"/>
    <circle cx="140" cy="350" r="3"/><circle cx="240" cy="350" r="3"/><circle cx="300" cy="370" r="3"/>
  </g>
  <!-- fringe -->
  <g stroke="#2a0606" stroke-width="1.5">
    <line x1="60" y1="335" x2="55" y2="360"/><line x1="80" y1="350" x2="78" y2="378"/>
    <line x1="120" y1="365" x2="118" y2="392"/><line x1="160" y1="375" x2="158" y2="402"/>
    <line x1="200" y1="380" x2="200" y2="408"/><line x1="240" y1="375" x2="242" y2="402"/>
    <line x1="280" y1="365" x2="282" y2="392"/><line x1="320" y1="350" x2="322" y2="378"/>
    <line x1="345" y1="335" x2="350" y2="360"/>
  </g>
  <text x="200" y="450" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#6e5944" text-anchor="middle">Silk Paisley Scarf</text>
</svg>
