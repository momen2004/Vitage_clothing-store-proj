<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="belt5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06030"/>
      <stop offset="1" stop-color="#5a2a10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#ead7b6"/>
  <!-- belt strap -->
  <rect x="40" y="220" width="320" height="60" rx="4" fill="url(#belt5)" stroke="#3a1d08" stroke-width="2"/>
  <!-- floral tooling -->
  <g stroke="#3a1d08" stroke-width="1" fill="none">
    <circle cx="100" cy="250" r="10"/><circle cx="100" cy="250" r="4" fill="#3a1d08"/>
    <path d="M95,240 Q90,230 80,235 M105,240 Q110,230 120,235 M95,260 Q90,270 80,265 M105,260 Q110,270 120,265"/>
    <circle cx="160" cy="250" r="10"/><circle cx="160" cy="250" r="4" fill="#3a1d08"/>
    <path d="M155,240 Q150,230 140,235 M165,240 Q170,230 180,235 M155,260 Q150,270 140,265 M165,260 Q170,270 180,265"/>
    <circle cx="220" cy="250" r="10"/><circle cx="220" cy="250" r="4" fill="#3a1d08"/>
    <path d="M215,240 Q210,230 200,235 M225,240 Q230,230 240,235 M215,260 Q210,270 200,265 M225,260 Q230,270 240,265"/>
    <circle cx="280" cy="250" r="10"/><circle cx="280" cy="250" r="4" fill="#3a1d08"/>
  </g>
  <!-- holes -->
  <circle cx="320" cy="250" r="4" fill="#3a1d08"/>
  <circle cx="340" cy="250" r="4" fill="#3a1d08"/>
  <!-- buckle -->
  <rect x="10" y="200" width="60" height="100" rx="6" fill="none" stroke="#c9a253" stroke-width="6"/>
  <line x1="55" y1="250" x2="80" y2="250" stroke="#c9a253" stroke-width="5"/>
  <text x="200" y="480" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#6e5944" text-anchor="middle">Tooled Western Belt</text>
</svg>
