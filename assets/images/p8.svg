<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fbf3e2"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2c3a55" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#ead7b6"/>
  <!-- shirt body -->
  <path d="M120,90 L200,70 L280,90 L320,140 L300,180 L300,440 L100,440 L100,180 L80,140 Z"
        fill="url(#stripe)" stroke="#0c1830" stroke-width="2"/>
  <path d="M80,140 L60,260 L110,280 L120,200" fill="url(#stripe)" stroke="#0c1830" stroke-width="2"/>
  <path d="M320,140 L340,260 L290,280 L280,200" fill="url(#stripe)" stroke="#0c1830" stroke-width="2"/>
  <!-- pointed collar -->
  <path d="M165,90 L200,160 L235,90 L210,70 L200,80 L190,70 Z" fill="#fbf3e2" stroke="#0c1830" stroke-width="1.5"/>
  <line x1="200" y1="160" x2="200" y2="440" stroke="#0c1830" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="4" fill="#0c1830"/>
  <circle cx="200" cy="250" r="4" fill="#0c1830"/>
  <circle cx="200" cy="300" r="4" fill="#0c1830"/>
  <circle cx="200" cy="350" r="4" fill="#0c1830"/>
  <circle cx="200" cy="400" r="4" fill="#0c1830"/>
  <text x="200" y="480" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#6e5944" text-anchor="middle">Pin-Stripe Oxford</text>
</svg>
