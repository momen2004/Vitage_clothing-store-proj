<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <pattern id="lin2" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#f1e3c0"/>
      <line x1="0" y1="1.5" x2="3" y2="1.5" stroke="rgba(160,136,88,0.18)" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#ead7b6"/>
  <!-- shoulders + body -->
  <path d="M120,90 L200,70 L280,90 L320,140 L300,180 L300,440 L100,440 L100,180 L80,140 Z"
        fill="url(#lin2)" stroke="#7a5e2f" stroke-width="2"/>
  <!-- sleeves -->
  <path d="M80,140 L60,260 L110,280 L120,200" fill="url(#lin2)" stroke="#7a5e2f" stroke-width="2"/>
  <path d="M320,140 L340,260 L290,280 L280,200" fill="url(#lin2)" stroke="#7a5e2f" stroke-width="2"/>
  <!-- collar/lapel -->
  <path d="M170,90 L200,150 L230,90 L200,75 Z" fill="#e0caa0" stroke="#7a5e2f" stroke-width="1.5"/>
  <line x1="200" y1="150" x2="200" y2="440" stroke="#7a5e2f" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- buttons -->
  <circle cx="200" cy="190" r="4" fill="#fbf3e2" stroke="#7a5e2f"/>
  <circle cx="200" cy="240" r="4" fill="#fbf3e2" stroke="#7a5e2f"/>
  <circle cx="200" cy="290" r="4" fill="#fbf3e2" stroke="#7a5e2f"/>
  <circle cx="200" cy="340" r="4" fill="#fbf3e2" stroke="#7a5e2f"/>
  <circle cx="200" cy="390" r="4" fill="#fbf3e2" stroke="#7a5e2f"/>
  <!-- chest pocket -->
  <rect x="130" y="200" width="50" height="55" fill="none" stroke="#7a5e2f" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="200" y="480" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#6e5944" text-anchor="middle">Linen Camp Shirt</text>
</svg>
