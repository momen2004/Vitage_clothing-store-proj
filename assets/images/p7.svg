<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <radialGradient id="tort" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9a5a2a"/>
      <stop offset="1" stop-color="#3b1d08"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="#ead7b6"/>
  <!-- left frame -->
  <circle cx="130" cy="250" r="65" fill="url(#tort)" stroke="#1c0e04" stroke-width="6"/>
  <circle cx="130" cy="250" r="50" fill="#3a2810"/>
  <circle cx="115" cy="235" r="12" fill="rgba(255,255,255,0.2)"/>
  <!-- tortoise spots -->
  <g fill="#1c0e04" opacity="0.6">
    <circle cx="90" cy="220" r="6"/><circle cx="170" cy="225" r="5"/>
    <circle cx="170" cy="285" r="6"/><circle cx="95" cy="290" r="5"/>
  </g>
  <!-- right frame -->
  <circle cx="270" cy="250" r="65" fill="url(#tort)" stroke="#1c0e04" stroke-width="6"/>
  <circle cx="270" cy="250" r="50" fill="#3a2810"/>
  <circle cx="255" cy="235" r="12" fill="rgba(255,255,255,0.2)"/>
  <g fill="#1c0e04" opacity="0.6">
    <circle cx="230" cy="220" r="6"/><circle cx="310" cy="225" r="5"/>
    <circle cx="310" cy="285" r="6"/><circle cx="235" cy="290" r="5"/>
  </g>
  <!-- bridge -->
  <path d="M195,240 Q200,225 205,240" fill="none" stroke="#1c0e04" stroke-width="8"/>
  <!-- temples -->
  <path d="M65,250 Q40,250 30,260" fill="none" stroke="#1c0e04" stroke-width="6"/>
  <path d="M335,250 Q360,250 370,260" fill="none" stroke="#1c0e04" stroke-width="6"/>
  <text x="200" y="430" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#6e5944" text-anchor="middle">Round Tortoise Shades</text>
</svg>
