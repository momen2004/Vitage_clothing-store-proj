<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="wool6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d4943"/>
      <stop offset="1" stop-color="#23211d"/>
    </linearGradient>
    <pattern id="herringbone" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="url(#wool6)"/>
      <path d="M0,4 L4,0 L8,4 L4,8 Z" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#ead7b6"/>
  <!-- cap dome -->
  <path d="M90,260 Q90,150 200,140 Q310,150 310,260 Q310,300 270,300 L130,300 Q90,300 90,260 Z"
        fill="url(#herringbone)" stroke="#0e0d0b" stroke-width="2"/>
  <!-- panel seams (8-panel) -->
  <path d="M200,140 L200,290" stroke="#0e0d0b" stroke-width="1.2" stroke-dasharray="3,2"/>
  <path d="M150,148 Q160,220 170,290" fill="none" stroke="#0e0d0b" stroke-width="1.2" stroke-dasharray="3,2"/>
  <path d="M250,148 Q240,220 230,290" fill="none" stroke="#0e0d0b" stroke-width="1.2" stroke-dasharray="3,2"/>
  <path d="M110,180 Q130,240 145,290" fill="none" stroke="#0e0d0b" stroke-width="1.2" stroke-dasharray="3,2"/>
  <path d="M290,180 Q270,240 255,290" fill="none" stroke="#0e0d0b" stroke-width="1.2" stroke-dasharray="3,2"/>
  <!-- button on top -->
  <circle cx="200" cy="148" r="6" fill="#23211d" stroke="#0e0d0b"/>
  <!-- brim -->
  <path d="M110,290 Q200,330 310,290 Q310,310 200,340 Q110,310 110,290 Z"
        fill="url(#herringbone)" stroke="#0e0d0b" stroke-width="2"/>
  <text x="200" y="430" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#6e5944" text-anchor="middle">Wool Newsboy Cap</text>
</svg>
