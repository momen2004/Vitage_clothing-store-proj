<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c66b"/>
      <stop offset="0.5" stop-color="#d96b3f"/>
      <stop offset="1" stop-color="#7a2a2a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#ead7b6"/>
  <!-- tee body -->
  <path d="M110,100 L200,80 L290,100 L330,160 L290,200 L290,430 L110,430 L110,200 L70,160 Z"
        fill="#c9522d" stroke="#5e1f1f" stroke-width="2"/>
  <!-- sleeves trim -->
  <path d="M110,100 L70,160 L100,180" fill="none" stroke="#5e1f1f" stroke-width="2"/>
  <path d="M290,100 L330,160 L300,180" fill="none" stroke="#5e1f1f" stroke-width="2"/>
  <!-- neck -->
  <path d="M170,90 Q200,120 230,90" fill="none" stroke="#5e1f1f" stroke-width="3"/>
  <!-- sunset graphic -->
  <circle cx="200" cy="270" r="55" fill="url(#sunset)"/>
  <rect x="140" y="270" width="120" height="6" fill="#5e1f1f"/>
  <rect x="150" y="285" width="100" height="4" fill="#5e1f1f"/>
  <rect x="160" y="298" width="80" height="3" fill="#5e1f1f"/>
  <text x="200" y="345" font-family="Georgia,serif" font-style="italic" font-size="12" fill="#5e1f1f" text-anchor="middle">— SUNSET —</text>
  <text x="200" y="480" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#6e5944" text-anchor="middle">Retro Sunset Tee</text>
</svg>
