<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="boot10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1c19"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#ead7b6"/>
  <!-- boot back -->
  <path d="M100,120 L180,120 L195,360 L260,370 L260,420 L80,420 L80,370 L90,360 Z"
        fill="url(#boot10)" stroke="#000" stroke-width="2"/>
  <!-- sole -->
  <rect x="75" y="410" width="190" height="22" fill="#000" rx="3"/>
  <!-- laces -->
  <g stroke="#d8c08a" stroke-width="2" fill="none">
    <path d="M105,150 L175,160"/><path d="M105,170 L175,180"/><path d="M105,190 L175,200"/>
    <path d="M105,210 L175,220"/><path d="M105,230 L175,240"/><path d="M105,250 L175,260"/>
    <path d="M105,270 L175,280"/><path d="M105,290 L175,300"/>
  </g>
  <!-- eyelets -->
  <g fill="#8a8270">
    <circle cx="105" cy="150" r="2.5"/><circle cx="105" cy="170" r="2.5"/><circle cx="105" cy="190" r="2.5"/>
    <circle cx="105" cy="210" r="2.5"/><circle cx="105" cy="230" r="2.5"/><circle cx="105" cy="250" r="2.5"/>
    <circle cx="175" cy="160" r="2.5"/><circle cx="175" cy="180" r="2.5"/><circle cx="175" cy="200" r="2.5"/>
    <circle cx="175" cy="220" r="2.5"/><circle cx="175" cy="240" r="2.5"/><circle cx="175" cy="260" r="2.5"/>
  </g>
  <!-- highlight -->
  <path d="M90,200 Q90,300 130,360" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
  <text x="200" y="480" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#6e5944" text-anchor="middle">Combat Boots</text>
</svg>
